<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartDesk AI</title>
<style>
:root {
  --header1:#2b4d73;--header2:#253a5b;--blue:#4c8bf5;--bg:#f7f9fb;
  --text:#1f2937;--sub:#6b7280;--white:#fff;--border:#e5e7eb;
}
html,body{margin:0;height:100%;font-family:"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
#header{background:linear-gradient(90deg,var(--header1),var(--header2));
  color:#fff;padding:14px 18px;display:flex;justify-content:space-between;
  align-items:center;font-size:16px;font-weight:600;-webkit-app-region:drag;}
.win-btn{background:transparent;border:none;color:#fff;font-size:18px;
  cursor:pointer;line-height:1;-webkit-app-region:no-drag;transition:opacity .2s;}
.win-btn:hover{opacity:.8;}
#main{flex:1;display:flex;flex-direction:column;padding:20px;gap:14px;overflow:hidden;}
#btns{text-align:center;}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;margin:6px;
  border-radius:8px;cursor:pointer;font-weight:500;box-shadow:0 2px 4px rgba(0,0,0,.1);
  transition:background .2s;}
button:hover{background:#3a76d6;}
#summary,#chat{background:var(--white);border-radius:12px;padding:18px;
  overflow-y:auto;box-shadow:0 2px 6px rgba(0,0,0,.08);border:1px solid var(--border);}
#summary{flex:1.2;}#chat{flex:1;}#chat b{color:var(--blue);}
#input{display:flex;padding:10px 20px 20px;gap:8px;}
#msg{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px;
  font-size:14px;outline:none;background:var(--white);}
#send{background:var(--blue);color:#fff;border-radius:8px;border:none;
  padding:0 18px;cursor:pointer;font-size:14px;transition:background .2s;}
#send:hover{background:#3a76d6;}
.modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;
  background:rgba(0,0,0,.6);justify-content:center;align-items:center;}
.modal-content{background:#fff;color:#111;padding:20px;border-radius:10px;width:400px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);}
.modal-content h3{margin-top:0;color:var(--header1);}
.modal-content input{width:100%;margin:10px 0 15px;padding:10px;border-radius:6px;border:1px solid #ccc;}
.modal-content button{background:var(--blue);color:#fff;border:none;padding:8px 14px;
  border-radius:6px;margin-right:6px;cursor:pointer;}
.modal-content button:hover{background:#3a76d6;}
#summary::-webkit-scrollbar,#chat::-webkit-scrollbar{width:8px;}
#summary::-webkit-scrollbar-thumb,#chat::-webkit-scrollbar-thumb{background:#cfd6df;border-radius:4px;}
</style>
</head>
<body>
<div id="header">
  <span>⚛️ SmartDesk AI</span>
  <div id="window-controls">
    <button class="win-btn" id="settings-btn">⚙️</button>
    <button class="win-btn" id="minimize-btn">–</button>
    <button class="win-btn" id="maximize-btn">▢</button>
    <button class="win-btn" id="close-btn">✕</button>
  </div>
</div>

<div id="main">
  <div id="btns">
    <button id="open">Choose Document</button>
    <button id="summarize">Summarize</button>
  </div>
  <div id="summary">Summary will appear here…</div>
  <div id="chat"></div>
</div>

<div id="input">
  <input id="msg" placeholder="Ask something about the document…" />
  <button id="send">▶</button>
</div>

<!-- Removed “Connected to:” footer -->

<div id="settings-modal" class="modal">
  <div class="modal-content">
    <h3>🔗 API Configuration</h3>
    <input type="text" id="api-input" placeholder="Enter backend API URL (e.g. http://127.0.0.1:8000)" />
    <button id="save-api">Save</button>
    <button id="close-modal">Cancel</button>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
